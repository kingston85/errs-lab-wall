<title>ERRS Lab Wall</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Control-room wall: a fixed 1920×1080 stage scaled to any screen, deep marine
   ground, data in cyan, targets and warnings in amber, exceedances in coral.
   Deliberately a single dark look: it is built for a wall-mounted screen. */
:root {
  --bg: #061019;
  --stage: #08141e;
  --panel: #0d1d2a;
  --panel2: #12283a;
  --line: #1d3447;
  --line2: #2a4a63;
  --ink: #e8f1f4;
  --dim: #8fa7b6;
  --mute: #5f7a8c;
  --accent: #3cc6d8;
  --amber: #f5b84a;
  --coral: #ff6b5e;
  --good: #3ddc97;
  --violet: #b48cff;
  --cmu: #f6a26b;
  --emru: #3cc6d8;
  --rsu: #c39bff;
  --wru: #8fd47f;
  --errs: #7ba7ff;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0; overflow: hidden;
}
body.kiosk { padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
#app { position: relative; height: 100%; }
#wrap { position: absolute; inset: 0; display: grid; place-items: center; overflow: hidden; }
#stage {
  position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px;
  margin: -540px 0 0 -960px; transform-origin: 50% 50%; background: var(--stage); overflow: hidden;
  font-variant-numeric: tabular-nums;
  background-image:
    radial-gradient(1200px 700px at 85% -10%, rgba(60,198,216,.10), transparent 60%),
    radial-gradient(900px 600px at -10% 110%, rgba(123,167,255,.07), transparent 60%);
}
/* faint graph-paper grid, like a lab chart recorder */
#stage::before { content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
  background-size: 48px 48px; }

/* ---------- top bar ---------- */
.top { position: absolute; left: 0; right: 0; top: 0; height: 104px; display: grid; grid-template-columns: 620px 1fr 460px; align-items: center; padding: 0 56px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, rgba(8,20,30,.95), rgba(8,20,30,.75)); z-index: 3; }
.brand { display: flex; align-items: center; gap: 18px; min-width: 0; }
.brand svg { flex: none; }
.brand .logo { flex: none; width: 74px; height: 74px; border-radius: 18px; background: #fff; padding: 3px; object-fit: contain; box-shadow: 0 0 0 2px rgba(60,198,216,.35), 0 6px 18px rgba(0,0,0,.35); }
.brand b { display: block; font-family: var(--f-display); font-weight: 700; font-size: 38px; letter-spacing: .02em; line-height: 1; }
.brand span { display: block; color: var(--dim); font-size: 17px; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nowshow { text-align: center; min-width: 0; }
.nowshow small { display: block; font-family: var(--f-mono); font-size: 16px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }
.nowshow strong { display: block; font-family: var(--f-display); font-weight: 600; font-size: 34px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clock { text-align: right; }
.clock b { font-family: var(--f-display); font-size: 52px; font-weight: 600; line-height: 1; letter-spacing: .02em; }
.clock span { display: block; color: var(--dim); font-size: 17px; margin-top: 4px; }
.live { display: inline-flex; align-items: center; gap: 8px; font-family: var(--f-mono); font-size: 14px; letter-spacing: .14em; color: var(--good); margin-right: 14px; vertical-align: 14px; }
.live i { width: 10px; height: 10px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 0 rgba(61,220,151,.6); animation: pulse 2s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 10px rgba(61,220,151,0); } 100% { box-shadow: 0 0 0 0 rgba(61,220,151,0); } }

/* ---------- scene host ---------- */
#host { position: absolute; left: 0; right: 0; top: 104px; bottom: 72px; }
.scene { position: absolute; inset: 0; padding: 36px 56px 30px; display: flex; flex-direction: column; gap: 26px; animation: sceneIn .8s cubic-bezier(.2,.7,.2,1) both; }
.scene.out { animation: sceneOut .55s ease both; }
@keyframes sceneIn { from { opacity: 0; transform: translateY(24px); } }
@keyframes sceneOut { to { opacity: 0; transform: translateY(-16px); } }
.rise { animation: rise .75s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--d, 0) * 70ms + 150ms); }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } }
.grow { transform-origin: left center; animation: grow 1.1s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--d, 0) * 60ms + 300ms); }
@keyframes grow { from { transform: scaleX(0); } }
.growy { transform-origin: center bottom; animation: growy 1.1s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--d, 0) * 60ms + 300ms); }
@keyframes growy { from { transform: scaleY(0); } }
.draw { stroke-dasharray: 2400; stroke-dashoffset: 2400; animation: draw 1.6s ease-out .4s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { .scene, .rise, .grow, .growy, .scene.out { animation: none !important; } .draw { stroke-dasharray: none; stroke-dashoffset: 0; animation: none; } .ticker-run { animation: none !important; } }

.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; }
.kicker { font-family: var(--f-mono); font-size: 18px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); display: flex; align-items: center; gap: 12px; }
.kicker .dot { width: 12px; height: 12px; border-radius: 3px; background: currentColor; }
h1.t { margin: 8px 0 0; font-family: var(--f-display); font-weight: 600; font-size: 60px; line-height: 1.02; letter-spacing: .005em; text-wrap: balance; }
.sub { color: var(--dim); font-size: 23px; max-width: 1180px; line-height: 1.4; margin-top: 10px; }
.src { font-family: var(--f-mono); font-size: 15px; color: var(--mute); text-align: right; line-height: 1.5; }
.grid { display: grid; gap: 22px; min-height: 0; flex: 1; }
.card { background: linear-gradient(180deg, rgba(18,40,58,.85), rgba(13,29,42,.85)); border: 1px solid var(--line); border-radius: 18px; padding: 24px 28px; min-width: 0; min-height: 0; position: relative; overflow: hidden; }
.card h3 { margin: 0 0 16px; font-family: var(--f-mono); font-weight: 500; font-size: 16px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
.big { font-family: var(--f-display); font-weight: 700; line-height: .9; letter-spacing: -.01em; }
.mono { font-family: var(--f-mono); }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; font-size: 17px; font-weight: 600; background: rgba(255,255,255,.06); border: 1px solid var(--line2); white-space: nowrap; }
.chip i { width: 10px; height: 10px; border-radius: 50%; }
.u-CMU { --u: var(--cmu); } .u-EMRU { --u: var(--emru); } .u-RSU { --u: var(--rsu); } .u-WRU { --u: var(--wru); } .u-ERRS { --u: var(--errs); }

/* hero */
.hero { display: grid; grid-template-columns: 1fr 520px; gap: 36px; flex: 1; min-height: 0; }
.hero h1 { font-family: var(--f-display); font-weight: 700; font-size: 104px; line-height: .95; margin: 14px 0 0; letter-spacing: -.005em; text-wrap: balance; }
.hero .lead { font-size: 27px; line-height: 1.45; color: #cfe0e7; max-width: 1080px; margin-top: 22px; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-top: auto; }
.tile { background: rgba(13,29,42,.9); border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px 18px; border-top: 4px solid var(--u, var(--accent)); min-width: 0; }
.tile .big { font-size: 84px; color: var(--ink); }
.tile b { display: block; font-size: 21px; margin-top: 10px; font-weight: 600; }
.tile span { display: block; color: var(--dim); font-size: 17px; margin-top: 6px; line-height: 1.35; }
.ring-wrap { display: grid; place-items: center; }
.ring-wrap .lbl { text-align: center; margin-top: 10px; color: var(--dim); font-size: 20px; }

/* outputs */
.orow { display: grid; grid-template-columns: 54px 1fr 150px; gap: 16px; align-items: center; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,.05); }
.orow .no { font-family: var(--f-mono); color: var(--dim); font-size: 19px; }
.orow .nm { font-size: 20px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.orow .nm small { color: var(--dim); font-weight: 400; margin-left: 10px; font-size: 16px; }
.track { position: relative; height: 16px; border-radius: 8px; background: rgba(255,255,255,.07); margin-top: 8px; overflow: visible; }
.track > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 8px; }
.track .mark { position: absolute; top: -6px; bottom: -6px; width: 3px; background: var(--ink); border-radius: 2px; opacity: .85; }
.pct { font-family: var(--f-display); font-size: 40px; font-weight: 700; text-align: right; line-height: 1; }
.pct small { display: block; font-family: var(--f-mono); font-size: 15px; color: var(--dim); font-weight: 400; margin-top: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 10px 18px; font-size: 17px; color: var(--dim); }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.legend i { width: 14px; height: 14px; border-radius: 4px; }

/* heatmap */
.hm { display: grid; gap: 3px; font-family: var(--f-mono); }
.hm .c { display: grid; place-items: center; border-radius: 5px; font-size: 15px; height: 44px; color: #dbe9ee; overflow: hidden; white-space: nowrap; }
.hm .rh { display: flex; flex-direction: column; justify-content: center; font-family: var(--f-body); padding-right: 10px; min-width: 0; }
.hm .rh b { font-family: var(--f-mono); font-size: 16px; font-weight: 600; white-space: nowrap; }
.hm .rh span { font-size: 13px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hm .ch { font-size: 14px; color: var(--dim); text-align: center; line-height: 1.15; align-self: end; padding-bottom: 6px; font-family: var(--f-body); }
.hm .ch b { display: block; color: var(--ink); font-size: 15px; font-weight: 600; }
.hm .lim { font-size: 13px; color: var(--amber); text-align: center; }
.find { display: flex; flex-direction: column; gap: 14px; }
.find p { margin: 0; font-size: 21px; line-height: 1.4; padding-left: 18px; border-left: 4px solid var(--coral); }
.find p.ok { border-color: var(--good); }

/* lists */
.tl { display: flex; flex-direction: column; gap: 4px; }
.tl .it { display: grid; grid-template-columns: 130px 20px 1fr; gap: 16px; align-items: start; padding: 10px 0; }
.tl .it time { font-family: var(--f-mono); color: var(--dim); font-size: 18px; padding-top: 3px; }
.tl .it .pin { width: 14px; height: 14px; border-radius: 50%; background: var(--u); margin-top: 8px; box-shadow: 0 0 0 5px rgba(255,255,255,.05); }
.tl .it b { font-size: 22px; font-weight: 500; line-height: 1.3; display: block; }
.tl .it span { color: var(--dim); font-size: 17px; }

/* ticker */
.ticker { position: absolute; left: 0; right: 0; bottom: 0; height: 72px; border-top: 1px solid var(--line); background: rgba(6,16,25,.96); display: flex; align-items: center; overflow: hidden; z-index: 3; }
.ticker .tag { flex: none; height: 100%; display: flex; align-items: center; padding: 0 28px 0 56px; font-family: var(--f-mono); font-size: 16px; letter-spacing: .18em; color: var(--bg); background: var(--accent); font-weight: 600; }
.ticker .lane { position: relative; flex: 1; overflow: hidden; height: 100%; }
.ticker-run { position: absolute; top: 0; height: 100%; display: flex; align-items: center; white-space: nowrap; gap: 0; animation: tick var(--tdur, 120s) linear infinite; will-change: transform; }
.ticker-run span { font-size: 24px; padding: 0 34px; color: #d6e5eb; }
.ticker-run span::after { content: "◆"; color: var(--accent); font-size: 12px; margin-left: 68px; vertical-align: 4px; }
@keyframes tick { to { transform: translateX(-50%); } }
.progress { position: absolute; left: 0; bottom: 72px; height: 3px; background: var(--accent); width: 0; z-index: 4; opacity: .9; }
.dots { position: absolute; right: 56px; bottom: 92px; display: flex; gap: 8px; z-index: 4; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.18); }
.dots i.on { background: var(--accent); width: 28px; border-radius: 6px; }

/* ---------- on-screen controls ---------- */
#hud { position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; gap: 8px; padding: 8px; border-radius: 16px; background: rgba(13,29,42,.92); border: 1px solid var(--line2); box-shadow: 0 12px 40px rgba(0,0,0,.5); z-index: 20; transition: opacity .3s; }
#hud.hide { opacity: 0; pointer-events: none; }
#hud button { border: 0; background: transparent; color: var(--ink); height: 44px; min-width: 44px; padding: 0 14px; border-radius: 10px; display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; }
#hud button:hover { background: rgba(255,255,255,.08); }
#hud button.pri { background: var(--accent); color: #04121a; }
#hud svg { width: 20px; height: 20px; }

/* ---------- manage drawer ---------- */
#manage { position: absolute; top: 0; right: 0; bottom: 0; width: min(620px, 100%); background: #0b1925; border-left: 1px solid var(--line2); z-index: 30; display: flex; flex-direction: column; box-shadow: -20px 0 60px rgba(0,0,0,.5); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
#manage header { display: flex; align-items: center; gap: 12px; padding: 18px 20px 12px; }
#manage header h2 { margin: 0; font-family: var(--f-display); font-size: 30px; font-weight: 600; flex: 1; }
.x { border: 1px solid var(--line2); background: transparent; border-radius: 10px; width: 40px; height: 40px; font-size: 22px; line-height: 1; }
.tabs { display: flex; flex-wrap: wrap; gap: 0 2px; padding: 0 14px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: transparent; padding: 12px 11px; color: var(--dim); font-weight: 600; border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--accent); }
.pane { flex: 1; overflow-y: auto; padding: 18px 20px 40px; display: flex; flex-direction: column; gap: 14px; }
.note { background: rgba(245,184,74,.10); border: 1px solid rgba(245,184,74,.4); color: #f8dca6; border-radius: 12px; padding: 12px 14px; font-size: 14px; line-height: 1.45; }
.drop { border: 2px dashed var(--line2); border-radius: 16px; padding: 26px 18px; text-align: center; background: rgba(255,255,255,.02); }
.drop.over { border-color: var(--accent); background: rgba(60,198,216,.08); }
.drop b { display: block; font-size: 18px; margin-bottom: 6px; }
.drop p { margin: 0 0 14px; color: var(--dim); font-size: 14px; line-height: 1.45; }
.btn { border: 1px solid var(--line2); background: var(--panel2); color: var(--ink); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: #04121a; }
.btn.dng { border-color: rgba(255,107,94,.6); color: #ffb3ab; }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.rep { border: 1px solid var(--line); border-radius: 14px; padding: 14px; background: var(--panel); display: flex; flex-direction: column; gap: 8px; }
.rep .tt { display: flex; gap: 10px; align-items: flex-start; }
.rep .tt b { flex: 1; font-size: 15px; line-height: 1.35; min-width: 0; overflow-wrap: anywhere; }
.rep small { color: var(--dim); font-size: 13px; }
.mini { display: flex; flex-wrap: wrap; gap: 6px; }
.mini span { font-size: 12px; padding: 3px 8px; border-radius: 999px; background: rgba(255,255,255,.06); color: var(--dim); }
label.f { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--dim); }
label.f input, label.f select, label.f textarea { background: #071420; border: 1px solid var(--line2); border-radius: 10px; padding: 10px 12px; color: var(--ink); font-size: 14px; }
label.f textarea { min-height: 90px; resize: vertical; line-height: 1.45; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.steps { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.steps div { display: flex; gap: 10px; align-items: center; color: var(--dim); }
.steps div.on { color: var(--ink); }
.steps div.done { color: var(--good); }
.steps div::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 2px solid currentColor; flex: none; }
.steps div.done::before { background: currentColor; }
.switch { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.switch input { width: 20px; height: 20px; accent-color: var(--accent); }
.answer { white-space: pre-wrap; background: #071420; border: 1px solid var(--line2); border-radius: 12px; padding: 14px; font-size: 14px; line-height: 1.55; min-height: 60px; }
pre.json { margin: 0; }
textarea.code { font-family: var(--f-mono); font-size: 12px; min-height: 320px; }
.toast { position: absolute; left: 50%; top: 24px; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--line2); border-radius: 12px; padding: 12px 18px; z-index: 40; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.45); max-width: calc(100% - 32px); }
.start { position: absolute; inset: 0; z-index: 25; display: grid; place-items: center; background: rgba(4,12,18,.55); }
.start div { text-align: center; background: rgba(13,29,42,.96); border: 1px solid var(--line2); border-radius: 20px; padding: 26px 30px; max-width: 460px; margin: 0 16px; }
.start h2 { margin: 0 0 8px; font-family: var(--f-display); font-size: 30px; }
.start p { margin: 0 0 18px; color: var(--dim); font-size: 15px; line-height: 1.5; }
@media (max-width: 520px) { .two { grid-template-columns: 1fr; } #hud button span { display: none; } }
#manage[hidden], [hidden] { display: none !important; }
.hm .rh { min-width: 0; overflow: hidden; } .hm .rh b, .hm .rh span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.photo-main figure { margin: 0; position: absolute; inset: 0; animation: phIn .9s ease both; }
.photo-main img { width: 100%; height: 100%; object-fit: cover; display: block; animation: kb 14s ease-out both; }
.photo-main figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 70px 36px 28px; background: linear-gradient(transparent, rgba(4,12,18,.92)); display: flex; flex-direction: column; gap: 8px; }
.photo-main figcaption b { font-size: 36px; font-weight: 600; line-height: 1.25; }
.photo-main figcaption span { font-family: var(--f-mono); font-size: 18px; color: #cfe0e7; letter-spacing: .06em; }
.photo-main .ph-miss { display: none; position: absolute; inset: 0; place-items: center; color: var(--dim); font-size: 22px; }
.photo-main figure.broken img { visibility: hidden; } .photo-main figure.broken .ph-miss { display: grid; }
@keyframes kb { from { transform: scale(1.09); } to { transform: scale(1); } }
@keyframes phIn { from { opacity: 0; } to { opacity: 1; } }
.thumb { flex: none; height: 168px; border-radius: 12px; overflow: hidden; border: 2px solid transparent; opacity: .45; transition: opacity .4s, border-color .4s; background: #0d1d2a; }
.thumb.on { opacity: 1; border-color: var(--accent); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.sbox { background: rgba(255,255,255,.035); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.sbox.od { border-color: rgba(255,107,94,.7); background: rgba(255,107,94,.08); }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
@media (prefers-reduced-motion: reduce) { .photo-main img, .photo-main figure { animation: none; } }
</style>
